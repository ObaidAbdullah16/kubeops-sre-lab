# Argo CD for the lab. Installed once by scripts/up.sh with Helm; everything
# else is deployed by Argo CD from this Git repository (gitops/).
global:
  domain: localhost

configs:
  params:
    server.insecure: true # plain HTTP on localhost:8090 (the cluster is local-only)
  cm:
    timeout.reconciliation: 60s
    # Let the app-of-apps wait for each Application to be healthy before the next
    # sync wave (Argo CD does not assess Application health by default).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # Kyverno creates many short-lived report objects: do not track them.
    resource.exclusions: |
      - apiGroups: [reports.kyverno.io]
        kinds: [EphemeralReport, ClusterEphemeralReport]
        clusters: ["*"]
      - apiGroups: [wgpolicyk8s.io]
        kinds: [PolicyReport, ClusterPolicyReport]
        clusters: ["*"]
      - apiGroups: [openreports.io]
        kinds: [Report, ClusterReport]
        clusters: ["*"]

dex:
  enabled: false
notifications:
  enabled: false

server:
  service:
    type: NodePort
    nodePortHttp: 30080 # http://localhost:8090 (kind/cluster.yaml maps 30080 -> 8090)
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

applicationSet:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

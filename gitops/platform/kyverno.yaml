# Kyverno with single replicas (lab). Policies live in gitops/policies.
# Kyverno's notes for Argo CD users: with preserve=true (the chart default) an app-of-apps
# shows Kyverno OutOfSync for ever.
config:
  preserve: false
admissionController:
  replicas: 1
  container:
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 384Mi}
backgroundController:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
cleanupController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
reportsController:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

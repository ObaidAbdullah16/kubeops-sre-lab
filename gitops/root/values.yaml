# scripts/up.sh sets repoURL to this repository's URL (works for forks too).
repoURL: https://github.com/ObaidAbdullah16/kubeops-sre-lab.git
targetRevision: main
# kind (laptop) or eks (scripts/eks-up.sh): eks adds gitops/platform/eks/<chart>.yaml overrides.
profile: kind

# Exact chart versions (Dependabot does not update these: bump them on purpose
# and test with `bash scripts/up.sh` before committing).
charts:
  kyverno:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    version: 3.9.1
  kubePrometheusStack:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 92.7.0
  loki:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    version: 7.3.0
  alloy:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    version: 1.13.1

apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow the latest tag
    policies.kyverno.io/description: >-
      Images must be pinned to a version tag or a digest. ':latest' (or no tag) makes rollbacks and audits impossible.
spec:
  validationActions: [Deny]
  # Also check Deployments, StatefulSets, ... so a bad manifest is rejected
  # at apply time instead of failing later when the ReplicaSet creates pods.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    # Only namespaces that opt in (label kubeops.dev/policy=enforce). The
    # platform namespaces (monitoring, argocd, kyverno) are left alone.
    namespaceSelector:
      matchLabels:
        kubeops.dev/policy: enforce
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    # Init containers run first, with the same pod privileges: check them too.
    - name: allContainers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.image.contains('@sha256:') ||
          (c.image.split('/')[c.image.split('/').size() - 1].contains(':') && !c.image.endsWith(':latest')))
      message: use a version tag or a digest, not ':latest' or an untagged image

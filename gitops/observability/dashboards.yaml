        {
          "id": 11,
          "type": "timeseries",
          "title": "Pod restarts in demo (10m)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8

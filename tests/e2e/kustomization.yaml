# CI end-to-end overlay: the real demo manifests, but in a namespace without the
# Kyverno "enforce" label and with the locally built (unsigned) image loaded into kind.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: e2e
resources:
  - ../../gitops/apps/demo
images:
  - name: ghcr.io/obaidabdullah16/kubeops-demo-app
    newName: kubeops-demo-app
    newTag: e2e
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: demo
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Service
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort

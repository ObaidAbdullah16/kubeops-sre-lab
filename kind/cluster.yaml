# Local 3-node cluster: 1 control plane + 2 workers (so node-failure drills work).
# Ports are published on 127.0.0.1 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubeops
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8090, listenAddress: "127.0.0.1"} # Argo CD
      - {containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1"} # Grafana
      - {containerPort: 30081, hostPort: 8081, listenAddress: "127.0.0.1"} # demo app
      - {containerPort: 30090, hostPort: 9090, listenAddress: "127.0.0.1"} # Prometheus
      - {containerPort: 30093, hostPort: 9093, listenAddress: "127.0.0.1"} # Alertmanager
  - role: worker
  - role: worker
